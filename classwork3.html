<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>classwork3</title>

    <style>
        div{
            width:300px;
            padding:20px;
            margin:50px auto;
            
        }
        h3{
            text-align:right;
            color:rgb(47, 89, 75);
            font-family:serif;
            margin-bottom: 10px;
        }
        p{
            text-align:center;
            letter-spacing:2px;
            text-transform:uppercase;
            
        }
        table,th,td{
            border:2px solid rgb(127, 117, 117); ;
            border-collapse: collapse;
            width:50%;
            text-align:center;
            height:50px;
            margin:auto;
            padding:10px;

        }
        
    </style>
</head>
<body>
    <div>
    <h3>Giorgio Armani</h3>
    <p>Beauty Begins with My Way </p>

    <table>
        <tr>
            <th>Department Name</th>
            <th>Contact numbers</th>
        </tr>
        <tr>
            <td>Customer Support</td>
            <td>+918956349234</td>
        </tr>

        <tr>
            <td>Marketing</td>
            <td>+912267893456</td>
        </tr>
        
    </table>
    </div>
</body>
</html>
